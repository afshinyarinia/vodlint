name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release tag and source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -c 'import os, pathlib, tomllib; v=tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]; assert os.environ["RELEASE_TAG"] == "v" + v, "Release tag must match v<package version>"'
          git merge-base --is-ancestor HEAD origin/main
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m black --check .
      - run: python -m pytest --cov=vodlint --cov-branch --cov-fail-under=85 -q
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/check_distribution.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vodlint
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
