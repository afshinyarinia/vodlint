name: Example validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fixture:
        description: 'Example to validate (invalid intentionally fails and retains its report)'
        type: choice
        options: [valid, invalid]
        default: valid

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'vodlint==0.2.0'
      - name: Validate manifest
        env:
          FIXTURE: ${{ inputs.fixture || 'valid' }}
        shell: bash
        run: |
          case "$FIXTURE" in
            valid) manifest=examples/valid.m3u8 ;;
            invalid) manifest=examples/invalid-target-duration.m3u8 ;;
            *) exit 2 ;;
          esac
          vodlint "$manifest" --json > vodlint-report.json
      - name: Preserve validation report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: vodlint-report
          path: vodlint-report.json
          if-no-files-found: error
          retention-days: 7
